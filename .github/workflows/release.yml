name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:v${{ steps.tags.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      - name: Verify published manifest
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository }}:v${{ steps.tags.outputs.version }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_note: true
          body: |
            ## Container image

            Multi-platform (linux/amd64 + linux/arm64):

            ```
            ghcr.io/keveon/synclet:v${{ steps.tags.outputs.version }}
            ```

            ## What to know

            - Credentials never touch config files — connections reference environment variable names (`connections.*.dsn_env`).
            - The container runs as a non-root user (uid 65532); bind-mounted checkpoint directories need `chown 65532:65532` on the host.
            - FHS runtime paths: config `/etc/synclet/config.yaml`, checkpoint state `/var/lib/synclet/state.json`.
